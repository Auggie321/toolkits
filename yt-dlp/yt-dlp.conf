# yt-dlp config file (ASCII only - Windows GBK compatible)

# output dir & filename: D:\yt-dlpDown\<video-title>\<video-title>.mp4
# use forward slashes - backslash is eaten by yt-dlp config parser
-P D:/yt-dlpDown
-o %(title)s/%(title)s.%(ext)s

# best quality, merge to mp4
-f bestvideo[ext=mp4]+bestaudio[ext=m4a]/bestvideo+bestaudio/best
--merge-output-format mp4

# n-challenge fix: use node.js runtime + auto-download EJS solver from GitHub
--js-runtimes node
--remote-components ejs:github
# force tv client (works with node EJS, no PO token needed)
--extractor-args youtube:player_client=tv,web

# subtitles: skip silently if unavailable
--write-sub
--write-auto-sub
--sub-langs zh-Hans,zh-Hant,zh,en,ja,ko,fr,de,es,pt,it,ru,ar,hi,th,vi
--convert-subs srt

# misc
--no-playlist
--retries 5
--fragment-retries 5
--file-access-retries 3
--progress
